[package]
name = "imagenie-desktop"
version = "0.2.2"
description = "A Tauri App"
authors = ["zhongwei"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "imagenie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
imagenie-core = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tauri = { version = "2", features = [ "protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2.0.0" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
tauri-plugin-log = { version = "2.0.1", features = ["colored"] }
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2.0.1"
tracing = { workspace = true }
image = { workspace = true }
tokio = "1.41.1"
reqwest = { workspace = true }
futures = "0.3"
futures-util = "0.3.31"
chrono = "0.4.38"

[package.metadata.cargo-machete]
ignored = ["serde_json", "serde", "tauri-plugin-http", "tauri-plugin-shell", "tokio"]
