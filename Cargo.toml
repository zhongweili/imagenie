[workspace]
resolver = "2"
members = ["crates/imagenie-core", "crates/imagenie-cli", "apps/desktop"]

[workspace.dependencies]
imagenie-core = { path = "crates/imagenie-core" }
anyhow = "1.0.91"
dirs = "5.0.1"
half = "2.3"
image = "0.25.4"
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", features = ["half"] }
rayon = "1.10.0"
reqwest = "0.12.9"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
sha2 = "0.10"
thiserror = "2.0.0"
tracing = { version = "0.1.40", features = ["log"] }
